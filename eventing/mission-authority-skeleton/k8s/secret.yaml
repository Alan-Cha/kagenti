---
# PostgreSQL credentials for mission-authority's own database
# Apply with: kubectl --context=openshift-eventing apply -f k8s/secret.yaml
#
# Replace placeholder values before applying:
#   POSTGRES_PASSWORD: choose a strong password
#   KEYCLOAK_CLIENT_SECRET: output of scripts/setup_keycloak.py
#
apiVersion: v1
kind: Secret
metadata:
  name: mission-authority-postgres-secret
  namespace: kagenti-system
type: Opaque
stringData:
  username: mission-authority
  password: eventing
  url: postgresql+asyncpg://mission-authority:eventing@mission-authority-postgres.kagenti-system.svc.cluster.local:5432/missions

---
apiVersion: v1
kind: Secret
metadata:
  name: mission-authority-secret
  namespace: kagenti-system
type: Opaque
stringData:
  # From: python scripts/setup_keycloak.py --config scripts/keycloak_config.yaml
  keycloak-client-secret: h4KB3paRHyqv4WKzIWEerIlBz4dZ4UwZ
