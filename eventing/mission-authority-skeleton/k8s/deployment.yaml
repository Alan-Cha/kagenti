---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mission-authority
  namespace: kagenti-system
  labels:
    app: mission-authority
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mission-authority
  template:
    metadata:
      labels:
        app: mission-authority
    spec:
      containers:
        - name: mission-authority
          image: image-registry.openshift-image-registry.svc:5000/kagenti-system/mission-authority:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: MISSION_AUTHORITY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mission-authority-postgres-secret
                  key: url
            - name: MISSION_AUTHORITY_KEYCLOAK_ENABLED
              value: "true"
            - name: MISSION_AUTHORITY_KEYCLOAK_URL
              value: "https://keycloak-keycloak.apps.ykt1.hcp.res.ibm.com"
            - name: MISSION_AUTHORITY_KEYCLOAK_REALM
              value: "kagenti"
            - name: MISSION_AUTHORITY_KEYCLOAK_CLIENT_ID
              value: "mission-authority"
            - name: MISSION_AUTHORITY_KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mission-authority-secret
                  key: keycloak-client-secret
            - name: MISSION_AUTHORITY_LOG_LEVEL
              value: "INFO"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: mission-authority
  namespace: kagenti-system
spec:
  selector:
    app: mission-authority
  ports:
    - port: 8000
      targetPort: 8000
