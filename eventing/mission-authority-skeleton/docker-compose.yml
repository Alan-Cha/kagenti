version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mission-authority-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: missions
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mission-authority:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mission-authority
    ports:
      # Host 8770 -> container 8000. 8000 is a very common dev port and often
      # collides with other local services; 8770 is far less likely to conflict.
      - "8770:8000"
    environment:
      MISSION_AUTHORITY_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/missions
      MISSION_AUTHORITY_LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./mission_authority:/app/mission_authority
    command: uvicorn mission_authority.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
