apiVersion: v1
kind: ConfigMap
metadata:
  name: discovery-proxy
  namespace: spire-server
data:
  proxy.py: |
    from http.server import HTTPServer, BaseHTTPRequestHandler
    import urllib.request
    import json

    UPSTREAM = "http://spire-spiffe-oidc-discovery-provider.spire-server.svc.cluster.local:8080"

    DISCOVERY_DOC = {
        "issuer": "http://spire-spiffe-oidc-discovery-provider.spire-server.svc.cluster.local",
        "jwks_uri": "http://spire-spiffe-oidc-discovery-provider.spire-server.svc.cluster.local/keys",
        "authorization_endpoint": "http://spire-spiffe-oidc-discovery-provider.spire-server.svc.cluster.local/authorize",
        "token_endpoint": "http://spire-spiffe-oidc-discovery-provider.spire-server.svc.cluster.local/token",
        "response_types_supported": ["id_token"],
        "subject_types_supported": ["public"],
        "id_token_signing_alg_values_supported": ["RS256", "ES256", "ES384"],
        "token_endpoint_auth_methods_supported": ["private_key_jwt", "client_secret_jwt"],
        "token_endpoint_auth_signing_alg_values_supported": ["RS256", "ES256", "ES384"]
    }

    class ProxyHandler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/.well-known/openid-configuration":
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(json.dumps(DISCOVERY_DOC).encode())
            else:
                try:
                    with urllib.request.urlopen(f"{UPSTREAM}{self.path}") as response:
                        self.send_response(response.status)
                        for header, value in response.headers.items():
                            self.send_header(header, value)
                        self.end_headers()
                        self.wfile.write(response.read())
                except Exception as e:
                    self.send_error(502, f"Proxy error: {e}")

        def log_message(self, format, *args):
            print(f"{self.address_string()} - {format % args}")

    if __name__ == "__main__":
        server = HTTPServer(("0.0.0.0", 8080), ProxyHandler)
        print("Proxy server running on port 8080")
        server.serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spire-oidc-proxy
  namespace: spire-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spire-oidc-proxy
  template:
    metadata:
      labels:
        app: spire-oidc-proxy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101  # nginx user
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: proxy
        image: python:3.11-slim
        command: ["python", "/app/proxy.py"]
        ports:
        - containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 65534  # nobody user
        volumeMounts:
        - name: config
          mountPath: /app/proxy.py
          subPath: proxy.py
      volumes:
      - name: config
        configMap:
          name: discovery-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: spire-oidc-proxy
  namespace: spire-server
spec:
  selector:
    app: spire-oidc-proxy
  ports:
  - port: 8080
    targetPort: 8080
